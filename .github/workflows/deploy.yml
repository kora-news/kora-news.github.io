name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        run: SITE_URL="https://${{ github.repository_owner }}.github.io" node scripts/build.js
      - name: Validate search-discovery signals
        run: SITE_URL="https://${{ github.repository_owner }}.github.io" node scripts/check-seo.js
      - name: Validate club squads and assets
        run: node scripts/check-clubs.js
      - name: Validate news discovery
        run: node scripts/check-news.js
      - name: Validate player profiles
        run: node scripts/check-players.js
      - name: Validate historical player profiles
        run: node scripts/check-historical-players.js
      - name: Validate fixture embeds
        run: node scripts/check-fixtures.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
